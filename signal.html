<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGNAL — voice training console</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#181310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIGNAL">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

  :root {
    --ink: #181310;
    --panel: #221B15;
    --panelUp: #2B221A;
    --line: #3A2F24;
    --brass: #C89B5A;
    --brassDim: #8A6B3E;
    --cream: #EFE6D4;
    --muted: #9A8C77;
    --rec: #E0523C;
    --ok: #7FA86B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--ink);
    color: var(--cream);
    font-family: 'Inter', system-ui, sans-serif;
  }
  button { font-family: inherit; }
  button:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 18px 60px; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--brassDim);
    text-transform: uppercase;
  }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; }
  .btn {
    background: var(--brass);
    color: var(--ink);
    border: none;
    border-radius: 3px;
    padding: 12px 22px;
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.08em;
    cursor: pointer;
    text-transform: uppercase;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .ghost {
    background: transparent;
    color: var(--brass);
    border: 1px solid var(--brassDim);
  }
  .vu-wrap { display: flex; gap: 3px; align-items: flex-end; height: 44px; }
  .vu-bar {
    width: 5px;
    border-radius: 1px;
    background: var(--brass);
    opacity: 0.22;
    animation-play-state: paused;
  }
  .vu-bar.hot { background: var(--rec); }
  .vu-bar.live { opacity: 0.9; animation-play-state: running; }
  @keyframes vu { from { height: 6px; } to { height: 44px; } }
  @media (prefers-reduced-motion: reduce) { .vu-bar { animation: none !important; } }

  .score-dial { text-align: center; flex: 1; }
  .score-dial .val { font-family: 'IBM Plex Mono', monospace; font-size: 26px; }
  .score-dial .lbl { font-size: 10px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }

  .piano-key { position: absolute; top: 0; border: 1px solid var(--line); border-radius: 0 0 4px 4px; cursor: pointer; box-sizing: border-box; user-select: none; }
  .piano-key.white { background: var(--cream); z-index: 1; }
  .piano-key.black { background: var(--ink); z-index: 2; }
  .piano-key.target { box-shadow: 0 0 0 3px var(--brass) inset; }
  .piano-key.white:active { background: var(--brass); }
  .piano-key.black:active { background: var(--brassDim); }
  .piano-label { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--ink); font-family: 'IBM Plex Mono', monospace; }
  .pop-cell { width: 100%; aspect-ratio: 1; border-radius: 4px; cursor: pointer; }

  textarea, input[type=password], input[type=text] {
    font-family: 'Inter', sans-serif;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--cream);
    font-size: 14px;
    padding: 10px 12px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  "use strict";

  /* ============================================================
     SIGNAL — a daily voice training console (standalone build)
     Tracks: VOICE / PRESENCE / REPS / MEDIA
     Vanilla JS port — no React, no build step, opens as a plain file.
     ============================================================ */

  var MODEL = "claude-sonnet-5";

  var FILLERS = ["um", "uh", "like", "you know", "kind of", "sort of", "basically", "actually", "i mean", "right?"];

  var WARMUPS = [
    { id: "w1", name: "Straw phonation", time: 120, how: "Hum gently through a straw (or pursed lips) sliding low to high and back. Keep it easy — this resets the vocal folds and gets air, not throat, doing the work.", video: "t8nfCmZRdNs" },
    { id: "w2", name: "Lip trills", time: 120, how: "Trill the lips on a steady tone, then slide up and down your range. If the trill stops, you've lost breath support — restart softer.", video: "CVCWwNILwVk" },
    { id: "w3", name: "Hum to the mask", time: 120, how: "Hum 'mm-hmm' and hunt for buzz in the lips, nose, and cheekbones. That buzz is forward placement. Open into 'mmm-ah' keeping the buzz up front.", video: "kcHDvQSN1v8" },
    { id: "w4", name: "Nay-nay twang", time: 120, how: "Say a bratty, cartoonish 'nay nay nay' up and down a small range. Obnoxious is correct — this builds the ring that cuts through a room.", video: "JRdavXE43D4" }
  ];

  var DRILLS = [
    { id: "d1", track: "VOICE", name: "Supported count-up", time: 180, how: "One breath, count aloud from 1, even volume, zero throat squeeze. Stop when support fades — never push. Three rounds; note your top number.", video: "nwXH0mlOdFk" },
    { id: "d2", track: "PRESENCE", name: "Read with intent", time: 180, how: "Read any paragraph aloud three ways: to reassure, to warn, to sell. Same words, three deliveries. The variance is the skill." },
    { id: "d3", track: "VOICE", name: "Pitch ladder", time: 180, how: "Speak one sentence at three deliberate pitches: low authority, mid conversational, bright emphasis. Land each rung cleanly — no drifting.", video: "7oRr6E_Eslo" },
    { id: "d4", track: "PRESENCE", name: "The pause rep", time: 180, how: "Deliver four sentences with a full two-second silence between each. Hold eye line forward. Discomfort in silence is the muscle being trained." },
    { id: "d5", track: "VOICE", name: "Consonant snap", time: 180, how: "Over-articulate a tongue twister slowly, then at speed: 'The tip of the tongue, the teeth, the lips.' Crisp finals — the T's and P's must land.", video: "kxQTyqGtZNo" },
    { id: "d6", track: "PRESENCE", name: "One-minute story", time: 180, how: "Tell a 60-second story from your week with a beginning, turn, and landing line. No warmup sentences — first sentence is the hook." }
  ];

  var REPS = [
    { id: "r1", track: "REPS", name: "Impromptu 90", time: 90, prompt: "Explain in 90 seconds why on-premise menu data is a leading indicator for the beverage alcohol category.",
      example: "Here's the short version: menus change faster than shelves do. A restaurant can swap a cocktail list or drop a keg line in a week, while a retail SKU set is locked for a planning cycle. That means what's happening on-premise today is what shows up in retail data next quarter, not the other way around. We track menu additions, drops, and pricing across tens of thousands of accounts, and it consistently front-runs the category shifts everyone else reads about after the fact. Take ready-to-drink cocktails: we saw them show up on menus eighteen months before the retail volume caught up. If you're only watching retail scan data, you're reading last quarter's decision. On-premise is where the decision gets made first. That's the whole thesis: menus are the leading indicator, retail is the lagging confirmation." },
    { id: "r2", track: "MEDIA", name: "Bridge the trap", time: 45, prompt: "A journalist asks: 'Isn't the three-tier system basically obsolete?' Answer in under 45 seconds. Bridge to one message you control, and flag your key point.",
      example: "There are real cracks in it, nobody disputes that direct shipping and delivery apps didn't exist when three-tier was written. But here's the point that actually matters: the data shows the tier under real pressure isn't distribution, it's retail. Independent stores are losing shelf space to delivery-native brands faster than distributors are losing relevance. So the real question isn't 'is three-tier obsolete,' it's 'which layer of it needs to modernize first,' and that's retail, not distribution." },
    { id: "r3", track: "REPS", name: "Impromptu 90", time: 90, prompt: "Explain in 90 seconds what a price index is, to a smart audience that has never worked with data.",
      example: "A price index isn't a price, it's a ruler. If I tell you the average bottle costs fourteen dollars, that number swings around depending on what mix of products people happened to buy that week. A price index strips that out: it tracks the same basket of products over time, so when the number moves, you know prices actually moved, it's not just because people bought more premium bottles this month. Think of it like tracking your weight on the same scale every morning instead of comparing yourself to a different person each day. That's why economists use CPI instead of an average grocery receipt, and it's exactly what we do at the SKU level for alcohol: hold the basket fixed, watch the index move, and now you actually know if prices are rising." },
    { id: "r4", track: "MEDIA", name: "Soundbite drill", time: 30, prompt: "Give a single quotable 20-second take: 'What's the biggest shift in how Americans buy alcohol?' One idea, clean landing.",
      example: "The biggest shift isn't where people buy, it's when they decide. Ten years ago the decision happened standing in a store aisle. Now it happens scrolling a delivery app before they've even left the couch. That's not a channel shift, that's a moment-of-decision shift, and almost nobody's built for it yet." },
    { id: "r5", track: "REPS", name: "Impromptu 90", time: 90, prompt: "You have 90 seconds on a conference panel: 'What do distributors misunderstand about their own data?'",
      example: "The biggest one: they think they see the market because they see their own book. But a distributor's data only shows what already made it onto their trucks, it can't show the accounts they've never sold into, or the shelf space a competitor is winning before it ever shows up as a lost PO. The second misunderstanding is treating velocity and distribution as the same signal. A SKU can look healthy because it's everywhere, while actually underperforming per account, and nobody catches it because the two numbers get blended into one chart. What matters is knowing your true addressable universe first, then measuring your share of it, not just admiring how big your own book looks from the inside." },
    { id: "r6", track: "MEDIA", name: "False premise", time: 45, prompt: "A reporter says: 'So your data shows delivery is killing retail stores, right?' It doesn't. Correct the premise without sounding defensive, in 45 seconds.",
      example: "That's not actually what the data shows, so let me correct that before we go further. Retail store count has been flat, what's changed is which stores are growing. Delivery is growing the stores that lean into it, and squeezing the ones that ignore it. So this isn't delivery killing retail, it's delivery separating winners from laggards inside retail. That's a very different story, and it's the one the data actually tells." },
    { id: "s1", track: "STORY", name: "The mind-changer", time: 90, prompt: "Tell a 90-second story about a moment when data changed your mind about something you were sure of. Hook first sentence, one clear turn, land the takeaway.",
      example: "I was sure delivery was cannibalizing retail. Then I pulled the actual menu data and watched myself be wrong in real time. Every account I checked that leaned into delivery wasn't losing volume, it was growing faster than the ones that ignored it. That's the moment I stopped treating channels as a zero-sum fight and started treating them as a bet on which retailers were actually paying attention. The data didn't confirm my thesis, it replaced it, and the replacement turned out to be the more useful one." },
    { id: "s2", track: "STORY", name: "The advice that landed", time: 60, prompt: "Tell a 60-second story about the best or worst piece of advice you ever got in your career. Make the ending do the work, not the setup.",
      example: "Someone told me early on: don't build the dashboard, build the decision. I ignored it for a year and built dashboards. Nobody used them, they were technically correct and completely unopened. The ones that finally landed were the ones that answered one specific question somebody actually had that week. Turns out the advice wasn't about dashboards at all, it was about starting from the decision and working backward, every single time." },
    { id: "s3", track: "STORY", name: "Almost gave up", time: 90, prompt: "Tell a 90-second story about a moment you almost gave up on something that ended up working. Hook first sentence, land on what actually changed.",
      example: "Six months in, the numbers said this shouldn't work, three sources blocked us in the same week. I remember thinking the honest move was to just say the free path didn't exist and walk away. Then one machine, one residential IP, and one afternoon proved the block was about where we were running from, not whether it was possible. The lesson wasn't don't give up in the abstract, it was that the failure was in the setup, not the plan, and those are very different problems." },

    { id: "n1", track: "NEGOTIATION", name: "Price increase pushback", time: 90, prompt: "Negotiate a price increase with a distributor who says every other supplier is holding steady.",
      example: "I hear you on the other suppliers, and I'm not going to pretend this is fun to ask for. But here's the honest version: our input costs moved, and holding this price means eating the difference every time you order, which isn't sustainable for either of us long-term. What I can do is lock this rate for twelve months so you're not renegotiating again in Q2, and give you thirty days before it takes effect. That's the trade I'm offering: stability for you, sustainability for us." },
    { id: "n2", track: "NEGOTIATION", name: "The 'not now' answer", time: 90, prompt: "Ask for a promotion after being told 'now's not the time.'",
      example: "I want to come back to this, because 'not now' isn't 'not ever,' and I want to understand which one it actually is. Can you tell me specifically what would need to be true in the next two quarters for the answer to change? I'm not looking for a yes today, I'm looking for a real target, so I'm not just asking again in six months hoping the timing improved on its own." },

    { id: "l1", track: "LEADERSHIP", name: "Hard feedback", time: 90, prompt: "Deliver hard feedback to someone who means well but is underperforming.",
      example: "I want to start with what's true: you care about this, and it shows. But the work isn't landing at the level the role needs right now, and I'd be doing you a disservice pretending otherwise. Here's specifically where the gap is, and here's what closing it would actually look like over the next month. I'm telling you this because I think you can close it, not because I've written you off." },
    { id: "l2", track: "LEADERSHIP", name: "Rally after a bad quarter", time: 90, prompt: "Rally a team the week after a bad quarter.",
      example: "I'm not going to stand up here and tell you that wasn't bad, because it was, and you'd see right through me if I tried. What I will say is we know exactly why it happened, which is the one thing that makes a bad quarter recoverable instead of repeatable. Here's what changes starting this week. We don't need a miracle. We need to do the three things that actually moved the number, on purpose, instead of by accident." },

    { id: "i1", track: "INTERVIEW", name: "Tell me about a failure", time: 90, prompt: "Answer 'tell me about a time you failed' honestly, without undermining yourself.",
      example: "I shipped a report to a client with a number I hadn't personally re-derived, because a teammate had already checked it and I trusted that. It was wrong, and it went out under my name. What I changed after that wasn't 'trust less,' it was building a habit where the last person before delivery independently re-derives the headline number, no matter who checked it earlier. That habit's caught two real errors since, quietly, before they ever left the building." },
    { id: "i2", track: "INTERVIEW", name: "Explain the pivot", time: 90, prompt: "Explain a gap or pivot in your career story confidently.",
      example: "I left that role because I'd solved the problem I was hired to solve, and the next interesting problem there wasn't mine to own. That's not a complaint about the company, it's just true. So I went looking for the harder version of the same problem, which is what brought me here. I'd rather tell you that straight than dress up a normal career decision as some dramatic story." },

    { id: "b1", track: "BOUNDARIES", name: "Saying no without over-explaining", time: 60, prompt: "Tell a close friend or family member you can't do something they're asking, without over-explaining.",
      example: "I can't take this on right now. I know that's probably not the answer you wanted, and I'm not going to bury it under five reasons, because the real reason is just that I don't have the capacity, and padding it with excuses would just make it sound negotiable when it isn't." },
    { id: "b2", track: "BOUNDARIES", name: "When someone keeps overstepping", time: 60, prompt: "Set a boundary with someone who keeps overstepping.",
      example: "I need you to stop doing that, and I mean that as a request, not an opening for a debate about whether it's a big deal. It is, to me. You don't have to agree with why for me to need it to stop." },

    { id: "c1", track: "CONNECTION", name: "The toast", time: 90, prompt: "Give a toast for a friend's milestone — personal and specific, under 90 seconds.",
      example: "I could tell you all the impressive-on-paper things about her, but the thing I actually remember is the year she drove four hours in a snowstorm because I said I was having a bad week, and didn't make it a thing when she got there. That's who she's always been to the people she loves: not loud about it, just there. So here's to the person who shows up, in the snow, without being asked twice." },
    { id: "c2", track: "CONNECTION", name: "Introduce yourself", time: 30, prompt: "Introduce yourself at a gathering where you know nobody, in a way people remember.",
      example: "I'm Chris. I spend my days trying to convince a beverage industry that's run on gut feel for a hundred years that the data's actually worth looking at. Some days that's a great pitch. Some days it's like arguing with the tide." },

    { id: "rp1", track: "REPAIR", name: "The real apology", time: 60, prompt: "Apologize for something you actually got wrong, without over-justifying.",
      example: "I got that wrong, and I'm not going to explain why I was tired or busy, because you don't owe me credit for a good reason, you're owed an actual apology. I'm sorry. I'll do it differently next time." },
    { id: "rp2", track: "REPAIR", name: "Asking for what you need", time: 60, prompt: "Ask for what you need in a relationship without making it an accusation.",
      example: "I need more of this from you, and I want to say that without it sounding like a complaint about what you're not doing, because it isn't. It's just a thing I need that I haven't been asking for clearly, and I want to start." },

    { id: "p1", track: "PITCH", name: "The 60-second pitch", time: 60, prompt: "Give a 60-second cold pitch for something you actually believe in — a product, an idea, a cause.",
      example: "Most beverage companies are still making six-figure distribution decisions off a gut feeling and a regional sales rep's opinion. We built the thing that replaces the gut feeling with an actual number: real observed pricing and shelf presence, not a survey. It's not flashy. It's just true, and once you've seen the real number you can't go back to guessing." },
    { id: "p2", track: "PITCH", name: "Handling 'we could build this ourselves'", time: 60, prompt: "Handle the objection: 'This sounds expensive for something we could probably build ourselves.'",
      example: "You could — a lot of teams start there. The part that's hard to build isn't the dashboard, it's the years of raw data underneath it, and by the time you've built enough of that to trust the numbers, you've spent more than this would've cost and lost the time. I'd rather you spend that time on what you're actually good at." },

    { id: "cc1", track: "CRISIS COMMS", name: "Explaining an internal mistake", time: 90, prompt: "Explain a mistake or outage to your own team or customers — not the press — in a way that builds trust instead of burning it.",
      example: "Here's what happened, in plain terms: a bad deploy Tuesday night dropped about six hours of data before we caught it. Here's what we've already done: backfilled from the raw source, verified the numbers match. And here's the actual fix, not just for this incident: we added a check that would have caught this before it shipped. I'd rather over-explain this once than have you find out less than the full picture later." },
    { id: "cc2", track: "CRISIS COMMS", name: "Telling a customer directly", time: 45, prompt: "You have to tell a customer their data was affected by an internal error. Deliver it directly, no hedging.",
      example: "I need to tell you something directly: your numbers from last week were affected by an error on our end, not yours. It's fixed, and the corrected data is in your account now. I'm not going to soften that more than that — it happened, it's fixed, and here's exactly what changed so you can see for yourself." },

    { id: "su1", track: "SUPPORT", name: "Being present, not performative", time: 60, prompt: "A friend tells you something genuinely hard is happening in their life. Respond in a way that's actually present, not performative.",
      example: "I'm not going to pretend I know what to say that fixes this, because I don't think anything does right now. I just want you to know I heard you, and I'm not going anywhere. Tell me what you actually need this week — even if it's just someone to sit with you and not talk about it." },
    { id: "su2", track: "SUPPORT", name: "Helping without taking over", time: 60, prompt: "Someone you care about is spiraling about a decision. Help without taking over.",
      example: "I've got thoughts, but this is your call, not mine, so I'm only going to say them if you want them. What I do know is you've made harder calls than this before and been fine. What's actually making this one feel different?" },

    { id: "ah1", track: "ASKING FOR HELP", name: "Asking for help with one specific thing", time: 45, prompt: "Ask for help with something you'd normally push through alone.",
      example: "I'm not going to pretend I've got this handled, because I don't, and pretending is costing me more than just asking would. I need help with this specific piece, not everything, just this part. Can you take it, or point me to someone who can?" },
    { id: "ah2", track: "ASKING FOR HELP", name: "Saying you're struggling", time: 45, prompt: "Tell someone close to you that you're struggling, before it gets worse.",
      example: "I haven't been okay for a few weeks, and I've been acting like it's fine because saying it out loud felt like admitting something. It's not fine. I don't need you to fix it, I just didn't want to keep pretending with you specifically." }
  ];

  /* ---------- piano: basic ear-training accelerant for the vocal work, not a pillar ---------- */
  var CHORD_SHAPES = {
    "C major": [{ n: "C", o: 4 }, { n: "E", o: 4 }, { n: "G", o: 4 }],
    "G major": [{ n: "G", o: 4 }, { n: "B", o: 4 }, { n: "D", o: 5 }],
    "D major": [{ n: "D", o: 4 }, { n: "F#", o: 4 }, { n: "A", o: 4 }],
    "A major": [{ n: "A", o: 4 }, { n: "C#", o: 5 }, { n: "E", o: 5 }],
    "E major": [{ n: "E", o: 4 }, { n: "G#", o: 4 }, { n: "B", o: 4 }],
    "F major": [{ n: "F", o: 4 }, { n: "A", o: 4 }, { n: "C", o: 5 }],
    "A minor": [{ n: "A", o: 4 }, { n: "C", o: 5 }, { n: "E", o: 5 }],
    "E minor": [{ n: "E", o: 4 }, { n: "G", o: 4 }, { n: "B", o: 4 }],
    "D minor": [{ n: "D", o: 4 }, { n: "F", o: 4 }, { n: "A", o: 4 }]
  };
  var PIANO_LESSONS = [
    { id: "p1", name: "Find your notes", mode: "sequence", instructions: "Tap each glowing key in order — this is just learning where the notes live.",
      sequence: [{ n: "C", o: 4 }, { n: "D", o: 4 }, { n: "E", o: 4 }, { n: "F", o: 4 }, { n: "G", o: 4 }] },
    { id: "p2", name: "C major scale", mode: "sequence", instructions: "Play the scale low to high, then back down. Same fixed reference every time — that's the point.",
      sequence: [
        { n: "C", o: 4 }, { n: "D", o: 4 }, { n: "E", o: 4 }, { n: "F", o: 4 }, { n: "G", o: 4 }, { n: "A", o: 4 }, { n: "B", o: 4 }, { n: "C", o: 5 },
        { n: "B", o: 4 }, { n: "A", o: 4 }, { n: "G", o: 4 }, { n: "F", o: 4 }, { n: "E", o: 4 }, { n: "D", o: 4 }, { n: "C", o: 4 }
      ] },
    { id: "p3", name: "Pitch match", mode: "match", instructions: "Listen, then tap the key that matches the pitch you heard — the actual ear-training drill for your voice work.",
      pool: [{ n: "C", o: 4 }, { n: "D", o: 4 }, { n: "E", o: 4 }, { n: "F", o: 4 }, { n: "G", o: 4 }, { n: "A", o: 4 }, { n: "B", o: 4 }, { n: "C", o: 5 }] },
    { id: "p4", name: "Play it for real", mode: "listen", instructions: "No tapping the screen — find each note on your OWN keyboard and actually play it. The mic listens and tells you if you got it. This is the one that teaches you where the keys really are.",
      sequence: [{ n: "C", o: 4 }, { n: "D", o: 4 }, { n: "E", o: 4 }, { n: "F", o: 4 }, { n: "G", o: 4 }, { n: "A", o: 4 }, { n: "B", o: 4 }, { n: "C", o: 5 }] },
    { id: "p5", name: "Common chords", mode: "chords", instructions: "No timer here — just step through common chords, see the shape, hear it, and try it on your own keyboard at your own pace.",
      chords: Object.keys(CHORD_SHAPES).map(function (name) { return { name: name, notes: CHORD_SHAPES[name] }; }) },
    { id: "p6", name: "Chord progressions", mode: "progressions", instructions: "How chords actually flow into each other. No timer — hit play and just listen and watch the shapes move, then try following along on your own keyboard.",
      progressions: [
        { name: "I–IV–V–I (the basic cadence, in C)", chordNames: ["C major", "F major", "G major", "C major"] },
        { name: "I–V–vi–IV (\"the four chords\" — used in hundreds of songs)", chordNames: ["C major", "G major", "A minor", "F major"] },
        { name: "vi–IV–I–V (same four chords, different feel)", chordNames: ["A minor", "F major", "C major", "G major"] },
        { name: "ii–V–I (the jazz turnaround, in C)", chordNames: ["D minor", "G major", "C major"] },
        { name: "I–vi–IV–V (the 1950s / doo-wop changes)", chordNames: ["C major", "A minor", "F major", "G major"] }
      ] }
  ];
  var NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  var audioCtx = null;

    var idx = NOTE_NAMES.indexOf(n);

  function freqToNote(freq) {
    if (!freq || freq <= 0 || !isFinite(freq)) return null;

  /* autocorrelation pitch detection (ACF2+, a standard technique) -- pure function of
     a time-domain buffer + sample rate, so it's fully testable with a synthetic sine
     wave without needing real mic input. */
  function detectPitch(buffer, sampleRate) {
    var SIZE = buffer.length;
    var rms = 0;
    for (var i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.01) return null; // too quiet / silence

    var r1 = 0, r2 = SIZE - 1, thres = 0.2;
    for (var i = 0; i < SIZE / 2; i++) { if (Math.abs(buffer[i]) < thres) { r1 = i; break; } }
    for (var i = 1; i < SIZE / 2; i++) { if (Math.abs(buffer[SIZE - i]) < thres) { r2 = SIZE - i; break; } }
    var trimmed = buffer.slice(r1, r2);
    var n = trimmed.length;
    if (n < 8) return null;

    var c = new Array(n).fill(0);
    for (var lag = 0; lag < n; lag++) {
      for (var j = 0; j < n - lag; j++) c[lag] += trimmed[j] * trimmed[j + lag];
    }
    var d = 0;
    while (d + 1 < n && c[d] > c[d + 1]) d++;
    var maxval = -1, maxpos = -1;
    for (var i = d; i < n; i++) { if (c[i] > maxval) { maxval = c[i]; maxpos = i; } }
    if (maxpos <= 0) return null;
    var T0 = maxpos;
    if (T0 > 0 && T0 < n - 1) {
      var x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
      var a = (x1 + x3 - 2 * x2) / 2;
      var b = (x3 - x1) / 2;
      if (a) T0 = T0 - b / (2 * a);
    }
    return sampleRate / T0;

    var gain = ctx.createGain();

    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.3, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

  function analyzeTranscript(text, seconds) {
    var clean = text.toLowerCase();

      var re = new RegExp("\\b" + f.replace("?", "\\?") + "\\b", "g");
      var m = clean.match(re);
      if (m) { fillerCount += m.length; found[f] = m.length; }

  /* ---------- audio clip storage (IndexedDB — blobs don't fit in localStorage) ---------- */
  function idbOpen() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open("signal-audio-db", 1);
      req.onupgradeneeded = function () { req.result.createObjectStore("clips"); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  async function idbPut(key, blob) {
    var db = await idbOpen();
    return new Promise(function (resolve, reject) {
      var tx = db.transaction("clips", "readwrite");
      tx.objectStore("clips").put(blob, key);
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  }
  async function idbGet(key) {
    var db = await idbOpen();
    return new Promise(function (resolve, reject) {
      var tx = db.transaction("clips", "readonly");
      var req = tx.objectStore("clips").get(key);
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  async function idbDelete(key) {
    var db = await idbOpen();
    return new Promise(function (resolve, reject) {
      var tx = db.transaction("clips", "readwrite");
      tx.objectStore("clips").delete(key);
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  }

  }

  async function importBackup(file) {
    if (!file) return;
    state.backupMsg = "Importing…";
    render();
    try {
      var text = await file.text();
      var payload = JSON.parse(text);
      if (!payload || !Array.isArray(payload.log)) throw new Error("bad-format");
      var incomingDates = payload.log.map(function (s) { return s.date; });
      state.log = state.log.filter(function (s) { return incomingDates.indexOf(s.date) === -1; }).concat(payload.log);
      state.log.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      saveLog(state.log);
      var clips = payload.clips || {};
      var keys = Object.keys(clips);
      for (var i = 0; i < keys.length; i++) {
        var blob = await dataUrlToBlob(clips[keys[i]]);
        await idbPut(keys[i], blob);
      }
      // max-merge, not sum/overwrite -- re-importing a backup you already have shouldn't double-count history
      if (payload.pianoCompletions) {
        var localPiano = loadPianoCompletions();
        Object.keys(payload.pianoCompletions).forEach(function (id) {
          localPiano[id] = Math.max(localPiano[id] || 0, payload.pianoCompletions[id]);
        });
        localStorage.setItem("signal-piano-completions", JSON.stringify(localPiano));

      if (payload.trapHistory) {
        var localTrap = loadTrapHistory();
        localTrap.runs = Math.max(localTrap.runs || 0, payload.trapHistory.runs || 0);
        localTrap.bestScore = Math.max(localTrap.bestScore || 0, payload.trapHistory.bestScore || 0);
        localStorage.setItem("signal-trap-history", JSON.stringify(localTrap));

    render();
  }

      a1.onended = function () {

  function computeStreak(log) {
    var days = Array.from(new Set(log.map(function (s) { return s.date; }))).sort().reverse();
    if (!days.length) return 0;
    var streak = 0;
    var cursor = new Date();
    if (days[0] !== todayKey()) cursor.setDate(cursor.getDate() - 1);
    for (;;) {
      var k = cursor.getFullYear() + "-" + String(cursor.getMonth() + 1).padStart(2, "0") + "-" + String(cursor.getDate()).padStart(2, "0");
      if (days.indexOf(k) !== -1) { streak++; cursor.setDate(cursor.getDate() - 1); }
      else break;
    }
    return streak;
  }

          system: sys,
          messages: [{ role: "user", content: user }]
        })
      });
    } catch (networkErr) {
      throw typedError("network", networkErr.message);
    }
    if (!res.ok) {
      var errText = await res.text();
      if (res.status === 401) throw typedError("auth", errText.slice(0, 200));
      if (res.status === 429) throw typedError("rate-limit", errText.slice(0, 200));
      if (res.status >= 500) throw typedError("server", errText.slice(0, 200));
      throw typedError("http-" + res.status, errText.slice(0, 200));

      throw typedError("parse", cleanText.slice(0, 150));
    }
  }

  var timerHandle = null;

  var mediaRecorder = null;

  var pitchAnalyser = null;
  var pitchLoopHandle = null;
  var pitchCooldownUntil = 0;

    if (i === 0) return WARMUPS;
    if (i === 1) return drillPoolFor(state.focusTrack);
    return repPoolFor(state.focusTrack);
  }
  function setFocusTrack(v) {
    if (state.running) return;

    state.stepIdx = 0;
    state.remaining = state.session[0].time;
    state.doneSteps = [];
    state.saved = false;
    state.score = null;
    state.scoreErr = null;
    state.transcript = "";
    state.repSeconds = 0;
    render();
  }
  function rerollStep() {
    if (state.running) return;
    stopSpeaking();
    state.showExample = false;
    state.showVideo = false;
    var arr = tierArrayFor(state.stepIdx);
    var current = state.session[state.stepIdx];
    var choices = arr.filter(function (x) { return x.id !== current.id; });
    if (!choices.length) return;
    var next = choices[Math.floor(Math.random() * choices.length)];
    state.session[state.stepIdx] = next;
    state.remaining = next.time;
    render();
  }

  /* ---------- mic audio capture — best effort; silently unavailable if no mic/permission ---------- */
  async function startAudioRecording() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      var mimeType = (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported("audio/webm")) ? "audio/webm" : "";
      mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType: mimeType }) : new MediaRecorder(mediaStream);
      mediaRecorder.ondataavailable = function (e) { if (e.data && e.data.size) audioChunks.push(e.data); };
      mediaRecorder.start();
    } catch (e) {
      mediaStream = null;
      mediaRecorder = null;
    }
  }
  function stopAudioRecording() {
    if (!mediaRecorder) return Promise.resolve(null);
    var recorder = mediaRecorder;
    var stream = mediaStream;
    return new Promise(function (resolve) {
      recorder.onstop = function () {
        var blob = new Blob(audioChunks, { type: audioChunks[0] ? audioChunks[0].type : "audio/webm" });
        stream.getTracks().forEach(function (t) { t.stop(); });
        resolve(blob);
      };
      try { recorder.stop(); } catch (e) { resolve(null); }
    });
  }
  function finishRepCapture() {
    stopListening();
    stopAudioRecording().then(function (blob) {
      mediaRecorder = null;
      mediaStream = null;
      audioChunks = [];
      if (blob && blob.size) {
        var key = todayKey() + "-" + Date.now();
        idbPut(key, blob).then(function () { state.pendingAudioKey = key; });
      }
    });
  }

    var seconds = state.repSeconds || (currentStep().time - state.remaining) || currentStep().time;
    return analyzeTranscript(state.transcript, seconds);
  }

  /* ---------- speech recognition ---------- */
  function startListening() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

      r.continuous = true;
      r.interimResults = true;
      r.lang = "en-US";
      finalTranscript = state.transcript ? state.transcript + " " : "";
      r.onresult = function (e) {
        var interim = "";
        for (var i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) finalTranscript += e.results[i][0].transcript + " ";
          else interim += e.results[i][0].transcript;
        }
        state.transcript = (finalTranscript + interim).trim();
        updateTranscriptUI();
      };
      r.onerror = function () { state.speechOk = false; render(); };
      r.start();
      recogRef = r;
      state.listening = true;
      render();
    } catch (e) {
      state.speechOk = false;
      render();
    }
  }

  }

  /* ---------- timer ---------- */
  function startStep() {
    stopSpeaking();
    state.running = true;
    if (isRepStep()) {
      state.score = null;
      state.scoreErr = null;
      state.pendingAudioKey = null;
      startListening();
      startAudioRecording();
    }
    render();
    timerHandle = setInterval(function () {
      state.remaining = Math.max(0, state.remaining - 1);
      if (isRepStep()) state.repSeconds++;
      if (state.remaining <= 0) {
        clearInterval(timerHandle);
        state.running = false;
        if (isRepStep()) finishRepCapture();
        render();
        return;
      }
      updateTimerUI();
    }, 1000);
  }
  function finishStep() {

    if (state.stepIdx < 2) {

    render();

    if (!state.transcript.trim()) return;
    if (!state.apiKey) {

      render();
      return;
    }
    state.scoring = true;
    state.scoreErr = null;
    render();
    try {
      var s = await scoreWithClaude(currentStep().prompt, state.transcript, currentMetrics(), currentStep().track);
      state.score = s;
    } catch (e) {
      var kindMessages = {
        "auth": "Your API key looks invalid or expired — check it in Settings (gear icon, top right).",
        "rate-limit": "Rate limited by Anthropic — wait a moment and try again.",
        "server": "Anthropic's API is having trouble right now — try again shortly.",
        "network": "Couldn't reach the API — check your connection and try again.",
        "parse": "Got a response back but couldn't read it. Try once more."
      };
      state.scoreErr = kindMessages[e.kind] || ("Scoring didn't come back clean. Try once more. (" + e.message + ")");
    }
    state.scoring = false;
    render();
  }

  function saveSession() {
    var m = currentMetrics();
    var entry = {
      date: todayKey(),
      minutes: Math.round(state.session.reduce(function (a, s) { return a + s.time; }, 0) / 60),
      wpm: m.wpm,

      rep: currentStep().name,
      track: currentStep().track || null,
      note: state.score ? state.score.fix_one_thing : "",
      audioKey: state.pendingAudioKey || null

    var previous = state.log.find(function (s) { return s.date === todayKey(); });
    if (previous && previous.audioKey && previous.audioKey !== entry.audioKey) {
      idbDelete(previous.audioKey).catch(function () {});
    }
    state.log = state.log.filter(function (s) { return s.date !== todayKey(); }).concat([entry]);
    saveLog(state.log);
    state.saved = true;
    render();
