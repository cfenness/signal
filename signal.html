  function trendSvgHtml(scored) {
    var recent = scored.slice(-14);
    var points = recent.map(function (s, i) {
      var x = (i / Math.max(recent.length - 1, 1)) * 290 + 5;
      var y = 55 - (s.overall / 10) * 50;
      return x + "," + y;
    }).join(" ");
    return (
      '<div class="card" style="margin-bottom:14px;">' +
        '<div class="eyebrow">rep score trend</div>' +
        '<svg viewBox="0 0 300 60" style="width:100%;height:60px;margin-top:8px;" aria-label="Score trend">' +
          '<polyline fill="none" stroke="var(--brass)" stroke-width="2" points="' + points + '"></polyline>' +
        "</svg>" +
      "</div>"
    );
  }

  function sparklineCardHtml(label, values, colorVar) {
    var recent = values.slice(-14);
    var min = Math.min.apply(null, recent);
    var max = Math.max.apply(null, recent);
    var range = max - min || 1;
    var points = recent.map(function (v, i) {
      var x = (i / Math.max(recent.length - 1, 1)) * 290 + 5;
      var y = 55 - ((v - min) / range) * 50;
      return x + "," + y;
    }).join(" ");
    return (
      '<div class="card" style="margin-bottom:14px;">' +
        '<div class="eyebrow">' + esc(label) + " · " + esc(min) + "–" + esc(max) + "</div>" +
        '<svg viewBox="0 0 300 60" style="width:100%;height:60px;margin-top:8px;" aria-label="' + esc(label) + ' trend">' +
          '<polyline fill="none" stroke="' + colorVar + '" stroke-width="2" points="' + points + '"></polyline>' +
        "</svg>" +
      "</div>"
    );
  }

  function heatmapHtml(log) {
    var byDate = {};
    log.forEach(function (s) { byDate[s.date] = s; });
    var days = [];
    var cursor = new Date();
    for (var i = 27; i >= 0; i--) {
      var d = new Date(cursor);
      d.setDate(cursor.getDate() - i);
      var key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      days.push({ key: key, entry: byDate[key] });
    }
    var cells = days.map(function (d) {
      var color = "var(--line)";
      var title = d.key + ": no session";
      if (d.entry) {
        var o = d.entry.overall;
        color = o == null ? "var(--brassDim)" : o >= 7 ? "var(--ok)" : o >= 4 ? "var(--brass)" : "var(--rec)";
        title = d.key + ": " + d.entry.rep + (o != null ? " · score " + o : "");
      }
      return '<div title="' + esc(title) + '" style="width:100%;aspect-ratio:1;border-radius:2px;background:' + color + ';"></div>';
    }).join("");
    return (
      '<div class="card" style="margin-bottom:14px;">' +
        '<div class="eyebrow">last 28 days</div>' +
        '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;">' + cells + "</div>" +
      "</div>"
    );
  }

  function backupBarHtml() {
    return (
      '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;">' +
        '<button id="btn-export" class="ghost" style="border-radius:3px;padding:6px 14px;font-size:12px;cursor:pointer;">&#8595; export backup</button>' +
        '<button id="btn-import" class="ghost" style="border-radius:3px;padding:6px 14px;font-size:12px;cursor:pointer;">&#8593; import backup</button>' +
        '<input id="import-file-input" type="file" accept="application/json" style="display:none;">' +
        (state.backupMsg ? '<span style="font-size:12px;color:var(--muted);">' + esc(state.backupMsg) + "</span>" : "") +
      "</div>"
    );
  }

  function otherPracticeHtml() {
    var pianoCounts = loadPianoCompletions();
    var pianoTotal = Object.keys(pianoCounts).reduce(function (sum, id) { return sum + pianoCounts[id]; }, 0);
    var trapHist = loadTrapHistory();
    if (!pianoTotal && !trapHist.runs) return "";
    var lines = [];
    if (pianoTotal) lines.push("Piano: " + pianoTotal + " session" + (pianoTotal === 1 ? "" : "s") + " completed");
    if (trapHist.runs) lines.push("Media traps: best " + trapHist.bestScore + " / " + MEDIA_SCENARIOS.length + " across " + trapHist.runs + " run" + (trapHist.runs === 1 ? "" : "s"));
    return (
      '<div class="card" style="margin-bottom:14px;">' +
        '<div class="eyebrow" style="margin-bottom:8px;">other practice</div>' +
        lines.map(function (l) { return '<div style="font-size:13px;color:var(--cream);margin-bottom:4px;">' + esc(l) + "</div>"; }).join("") +
      "</div>"
    );
  }

  function coverageHtml(log) {
    var repTracks = TRACKS.filter(function (t) { return t !== "VOICE" && t !== "PRESENCE"; });
    var counts = {};
    repTracks.forEach(function (t) { counts[t] = 0; });
    log.forEach(function (s) { if (s.track && counts.hasOwnProperty(s.track)) counts[s.track]++; });
    var sorted = repTracks.slice().sort(function (a, b) { return counts[a] - counts[b]; });
    var maxCount = Math.max.apply(null, repTracks.map(function (t) { return counts[t]; })) || 1;
    return (
      '<div class="card" style="margin-bottom:14px;">' +
        '<div class="eyebrow" style="margin-bottom:10px;">rep category coverage</div>' +
        sorted.map(function (t) {
          var c = counts[t];
          var label = t.split(" ").map(function (w) { return w.charAt(0) + w.slice(1).toLowerCase(); }).join(" ");
          var pct = Math.round((c / maxCount) * 100);
          return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;">' +
            '<span style="flex:0 0 96px;font-size:10px;line-height:1.3;color:' + (c === 0 ? "var(--rec)" : "var(--cream)") + ';">' + esc(label) + "</span>" +
            (c === 0
              ? '<span style="flex:1;font-size:10px;color:var(--rec);">not practiced yet</span>'
              : '<div style="flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;"><div style="height:100%;width:' + pct + '%;background:var(--brass);"></div></div>')
            +
            '<span style="width:18px;text-align:right;font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:var(--muted);">' + c + "</span>" +
          "</div>";
        }).join("") +
      "</div>"
    );
  }

  function logViewHtml() {
    var scored = state.log.filter(function (s) { return s.overall != null; });
    var byDateAsc = state.log.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    var day1 = byDateAsc[0];
    var out = backupBarHtml();
    if (state.log.length) out += heatmapHtml(state.log);
    if (state.log.length) out += coverageHtml(state.log);
    out += otherPracticeHtml();
    if (scored.length > 1) out += trendSvgHtml(scored);
    if (byDateAsc.length > 1) {
      out += sparklineCardHtml("pace (wpm)", byDateAsc.map(function (s) { return s.wpm || 0; }), "var(--ok)");
      out += sparklineCardHtml("fillers", byDateAsc.map(function (s) { return s.fillers || 0; }), "var(--rec)");
    }
    if (!state.log.length) {
      out += '<div class="card" style="color:var(--muted);font-size:14px;">No sessions yet. Run today\'s session and log it — the streak starts at one.</div>';
    } else {
      state.log.slice().reverse().forEach(function (s) {
        var canCompare = s.audioKey && day1 && day1.audioKey && s.date !== day1.date;
        out += (
          '<div class="card" style="margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;">' +
            "<div>" +
              '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;">' + esc(s.date) + "</div>" +
              (s.track ? '<span class="eyebrow" style="display:inline-block;margin-top:4px;">' + esc(s.track) + "</span>" : "") +
              '<div style="font-size:12px;color:var(--muted);margin-top:4px;">' + esc(s.rep) + " · " + esc(s.wpm || "—") + " wpm · " + esc(s.fillers != null ? s.fillers : "—") + " fillers</div>" +
              (s.note ? '<div style="font-size:12px;color:var(--muted);margin-top:4px;">' + esc(s.note) + "</div>" : "") +
              '<div style="display:flex;gap:8px;margin-top:6px;">' +
                (s.audioKey ? '<button class="ghost play-clip-btn" data-audio-key="' + esc(s.audioKey) + '" style="border-radius:3px;padding:4px 10px;font-size:11px;cursor:pointer;">&#9654; play</button>' : "") +
                (canCompare ? '<button class="ghost compare-btn" data-current="' + esc(s.audioKey) + '" data-day1="' + esc(day1.audioKey) + '" style="border-radius:3px;padding:4px 10px;font-size:11px;cursor:pointer;">vs day 1</button>' : "") +
              "</div>" +
            "</div>" +
            '<div style="text-align:right;">' +
              '<button class="ghost delete-session-btn" data-date="' + esc(s.date) + '" style="border-color:var(--line);color:var(--muted);border-radius:3px;padding:2px 8px;font-size:11px;cursor:pointer;margin-bottom:8px;">delete</button>' +
              '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:22px;color:' + (s.overall >= 7 ? "var(--ok)" : "var(--brass)") + ';">' + esc(s.overall != null ? s.overall : "—") + "</div>" +
              '<div style="font-size:10px;color:var(--muted);letter-spacing:0.12em;">SCORE</div>' +
            "</div>" +
          "</div>"
        );
      });
    }
    return out;
  }

  function todayViewHtml() {
    var out = "";
    if (doneToday() && state.saved) {
      out += '<div class="card" style="border-color:var(--ok);margin-bottom:14px;"><div class="eyebrow" style="color:var(--ok);">logged</div><div style="margin-top:6px;font-size:14px;">Today\'s session is in the book. Day ' + computeStreak(state.log) + " of the streak.</div></div>";
    }
    out += trackPickerHtml();
    out += stepStripHtml();
    out += activeStepHtml();
    out += repCaptureHtml();
    if (state.doneSteps.length >= 2 && !state.saved) {
      out += '<button id="btn-save-session" class="btn" style="width:100%;">Log today\'s session</button>';
    }
    return out;
  }

  function playCurrentTargetNote() {
    var lesson = PIANO_LESSONS[state.pianoLessonIdx];
    if (!lesson || (lesson.mode !== "sequence" && lesson.mode !== "listen")) return;
    var expected = lesson.sequence[state.pianoStepIdx];
    if (expected) playNote(expected.n, expected.o, 0.5);
  }
  function selectPianoLesson(i) {
    if (state.pianoListening) stopPitchListening();
    progressionPlaybackToken++; // invalidate any pending setTimeout chain from a previous progression
    state.pianoLessonIdx = i;
    state.pianoStepIdx = 0;
    state.pianoChordIdx = 0;
    state.pianoProgressionIdx = 0;
    state.pianoProgressionStep = 0;
    state.pianoProgressionPlaying = false;
    state.pianoMsg = null;
    state.pianoTargetNote = null;
    state.pianoMatchCorrect = 0;
    state.pianoMatchTotal = 0;
    state.pianoListenHeard = null;
    state.pianoListenErr = null;
    render();
    var lesson = PIANO_LESSONS[i];
    if (lesson.mode === "chords") {
      scrollPianoToNote(lesson.chords[0].notes[0]);
      hearChord();
    } else if (lesson.mode === "progressions") {
      playCurrentProgression();
    } else {
      playCurrentTargetNote();
      scrollPianoToDefault();
    }
  }
  function restartPianoLesson() {
    if (state.pianoListening) stopPitchListening();
    state.pianoStepIdx = 0;
    state.pianoMsg = null;
    state.pianoListenHeard = null;
    state.pianoListenErr = null;
    render();
    playCurrentTargetNote();
    scrollPianoToDefault();
  }

  /* ---------- listen mode: confirm real keyboard input via mic + pitch detection ---------- */
  async function startPitchListening() {
    try {
      pitchStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      state.pianoListenErr = "Couldn't access the mic — check permissions and try again.";
      render();
      return;
    }
    var ctx = ensureAudioCtx();
    var source = ctx.createMediaStreamSource(pitchStream);
    pitchAnalyser = ctx.createAnalyser();
    pitchAnalyser.fftSize = 2048;
    source.connect(pitchAnalyser);
    state.pianoListening = true;
    state.pianoListenErr = null;
    state.pianoListenHeard = null;
    pitchCooldownUntil = 0;
    render();
    // setInterval, not requestAnimationFrame -- rAF is tied to visual rendering and gets
    // aggressively throttled/paused when the tab isn't the active foreground view (screen
    // dim, glancing at another app), which would silently stall a listening session.
    pitchLoopHandle = setInterval(pitchLoopTick, 100);
  }
  function stopPitchListening() {
    if (pitchStream) pitchStream.getTracks().forEach(function (t) { t.stop(); });
    pitchStream = null;
    pitchAnalyser = null;
    if (pitchLoopHandle) { clearInterval(pitchLoopHandle); pitchLoopHandle = null; }
    state.pianoListening = false;
    render();
  }
  function pitchLoopTick() {
    if (!pitchAnalyser) return;
    var buf = new Float32Array(pitchAnalyser.fftSize);
    pitchAnalyser.getFloatTimeDomainData(buf);
    var now = performance.now();
    if (now > pitchCooldownUntil) {
      var freq = detectPitch(buf, audioCtx.sampleRate);
      var note = freqToNote(freq);
      if (note) {
        var lesson = PIANO_LESSONS[state.pianoLessonIdx];
        var expected = lesson.sequence[state.pianoStepIdx];
        if (expected) {
          state.pianoListenHeard = note.n + note.o;
          if (note.n === expected.n && note.o === expected.o) {
            state.pianoStepIdx++;
            var listenDone = state.pianoStepIdx >= lesson.sequence.length;
            state.pianoMsg = listenDone ? "Lesson complete!" : null;
            if (listenDone) recordPianoCompletion(lesson.id);
            pitchCooldownUntil = now + 900;
            if (state.pianoStepIdx < lesson.sequence.length) setTimeout(playCurrentTargetNote, 500);
          } else {
            pitchCooldownUntil = now + 350;
          }
          render();
        }
      }
    }
  }
  function pianoPlayPrompt() {
    var lesson = PIANO_LESSONS[state.pianoLessonIdx];
    if (state.pianoTargetNote) {
      playNote(state.pianoTargetNote.n, state.pianoTargetNote.o, 0.6);
      return;
    }
    var pick = lesson.pool[Math.floor(Math.random() * lesson.pool.length)];
    state.pianoTargetNote = pick;
    state.pianoMsg = null;
    playNote(pick.n, pick.o, 0.6);
    render();
  }
  function onPianoKeyTap(note) {
    playNote(note.n, note.o, 0.5);
    var lesson = PIANO_LESSONS[state.pianoLessonIdx];
    if (lesson.mode === "sequence") {
      var expected = lesson.sequence[state.pianoStepIdx];
      if (expected && note.n === expected.n && note.o === expected.o) {
        state.pianoStepIdx++;
        var seqDone = state.pianoStepIdx >= lesson.sequence.length;
        state.pianoMsg = seqDone ? "Lesson complete!" : null;
        if (seqDone) recordPianoCompletion(lesson.id);
        render();
        if (state.pianoStepIdx < lesson.sequence.length) {
          setTimeout(playCurrentTargetNote, 550);
        }
      }
    } else if (lesson.mode === "match") {
      if (state.pianoTargetNote) {
        var target = state.pianoTargetNote;
        var correct = note.n === target.n && note.o === target.o;
        state.pianoMatchTotal++;
        if (correct) { state.pianoMatchCorrect++; state.pianoMsg = "✓ correct"; }
        else { state.pianoMsg = "not quite — that was " + target.n + target.o; }
        state.pianoTargetNote = null;
        render();
      }
    }
  }
  function isPianoTargetKey(note, lesson) {
    if (lesson.mode === "sequence") {
      var expected = lesson.sequence[state.pianoStepIdx];
      return !!expected && note.n === expected.n && note.o === expected.o;
    }
    if (lesson.mode === "chords") {
      var chord = lesson.chords[state.pianoChordIdx];
      return chord.notes.some(function (cn) { return cn.n === note.n && cn.o === note.o; });
    }
    if (lesson.mode === "progressions") {
      var prog = lesson.progressions[state.pianoProgressionIdx];
      var chordName = prog.chordNames[state.pianoProgressionStep];
      var shape = CHORD_SHAPES[chordName];
      return !!shape && shape.some(function (cn) { return cn.n === note.n && cn.o === note.o; });
    }
    return false;
  }

  function keyboardHtml(lesson) {
    var whiteWidth = 34, blackWidth = 22, blackHeight = 74, whiteHeight = 120;
    var notes = buildKeyboardRange();
    var whiteIdx = 0;
    var whiteKeysHtml = "", blackKeysHtml = "";
    notes.forEach(function (note) {
      var isBlack = note.n.indexOf("#") !== -1;
      var keyId = note.n + note.o;
      var isTarget = isPianoTargetKey(note, lesson);
      if (!isBlack) {
        var left = whiteIdx * whiteWidth;
        whiteKeysHtml += '<div class="piano-key white' + (isTarget ? " target" : "") + '" data-note="' + keyId + '" style="left:' + left + 'px;width:' + (whiteWidth - 2) + 'px;height:' + whiteHeight + 'px;">' +
          (note.n === "C" ? '<span class="piano-label">C' + note.o + "</span>" : "") + "</div>";
        whiteIdx++;
      } else {
        var bLeft = whiteIdx * whiteWidth - blackWidth / 2;
        blackKeysHtml += '<div class="piano-key black' + (isTarget ? " target" : "") + '" data-note="' + keyId + '" style="left:' + bLeft + 'px;width:' + blackWidth + 'px;height:' + blackHeight + 'px;"></div>';
      }
    });
    var totalWidth = whiteIdx * whiteWidth;
    return (
      '<div id="piano-keyboard-scroll" style="overflow-x:auto;padding-bottom:8px;">' +
        '<div style="position:relative;width:' + totalWidth + 'px;height:' + whiteHeight + 'px;">' +
          whiteKeysHtml + blackKeysHtml +
        "</div>" +
      "</div>"
    );
  }

  function sequenceLessonControlsHtml(lesson) {
    var done = state.pianoStepIdx >= lesson.sequence.length;
    return (
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--muted);">' +
        (done ? "Done — " + lesson.sequence.length + "/" + lesson.sequence.length : "Next: tap the glowing key (" + (state.pianoStepIdx + 1) + "/" + lesson.sequence.length + ")") +
      "</div>" +
      '<button id="btn-piano-restart" class="ghost" style="margin-top:10px;border-radius:3px;padding:6px 14px;font-size:12px;cursor:pointer;">restart</button>'
    );
  }
  function matchLessonControlsHtml() {
    return (
      '<div style="display:flex;gap:10px;align-items:center;">' +
        '<button id="btn-piano-prompt" class="btn" style="padding:8px 18px;font-size:14px;">' + (state.pianoTargetNote ? "&#9658; replay" : "&#9658; play note") + "</button>" +
        '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--muted);">' + state.pianoMatchCorrect + "/" + state.pianoMatchTotal + " correct</span>" +
      "</div>"
    );
  }
  function listenLessonControlsHtml(lesson) {
    var done = state.pianoStepIdx >= lesson.sequence.length;
    var expected = lesson.sequence[state.pianoStepIdx];
    if (done) {
      return (
        '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--ok);margin-bottom:10px;">Done — ' + lesson.sequence.length + "/" + lesson.sequence.length + "</div>" +
        '<button id="btn-piano-restart" class="ghost" style="border-radius:3px;padding:6px 14px;font-size:12px;cursor:pointer;">restart</button>'
      );
    }
    return (
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--muted);margin-bottom:10px;">Find and play (' + (state.pianoStepIdx + 1) + "/" + lesson.sequence.length + ")</div>" +
      '<div style="font-family:\'Big Shoulders Display\',sans-serif;font-weight:700;font-size:44px;letter-spacing:0.04em;margin-bottom:14px;">' + esc(expected.n + expected.o) + "</div>" +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">' +
        (state.pianoListening
          ? '<button id="btn-listen-stop" class="btn" style="background:var(--rec);color:var(--cream);padding:8px 18px;font-size:14px;">&#9632; stop listening</button>'
          : '<button id="btn-listen-start" class="btn" style="padding:8px 18px;font-size:14px;">&#9679; start listening</button>') +
        (state.pianoListening ? '<span class="eyebrow" style="color:var(--rec);">&#9679; listening…</span>' : "") +
      "</div>" +
      (state.pianoListenHeard ? '<div style="margin-top:10px;font-size:13px;color:var(--muted);">last heard: <b style="color:var(--brass);">' + esc(state.pianoListenHeard) + "</b></div>" : "") +
      (state.pianoListenErr ? '<div style="margin-top:10px;font-size:13px;color:var(--rec);">' + esc(state.pianoListenErr) + "</div>" : "")
    );
  }

  function goToChord(lesson, i) {
    var n = lesson.chords.length;
    state.pianoChordIdx = ((i % n) + n) % n;
    render();
    scrollPianoToNote(lesson.chords[state.pianoChordIdx].notes[0]);
    hearChord();
  }
  function nextChord() { goToChord(PIANO_LESSONS[state.pianoLessonIdx], state.pianoChordIdx + 1); }
  function prevChord() { goToChord(PIANO_LESSONS[state.pianoLessonIdx], state.pianoChordIdx - 1); }
  function hearChord() {
    var lesson = PIANO_LESSONS[state.pianoLessonIdx];
    var chord = lesson.chords[state.pianoChordIdx];
    chord.notes.forEach(function (n) { playNote(n.n, n.o, 0.9); });
  }
  function chordControlsHtml(lesson) {
    var chord = lesson.chords[state.pianoChordIdx];
    return (
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--muted);margin-bottom:8px;">' + (state.pianoChordIdx + 1) + " / " + lesson.chords.length + "</div>" +
      '<div style="font-family:\'Big Shoulders Display\',sans-serif;font-weight:700;font-size:36px;letter-spacing:0.03em;margin-bottom:6px;">' + esc(chord.name) + "</div>" +
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--muted);margin-bottom:16px;">' + chord.notes.map(function (n) { return n.n + n.o; }).join(" · ") + "</div>" +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
        '<button id="btn-chord-prev" class="ghost" style="border-radius:3px;padding:8px 16px;font-size:13px;cursor:pointer;">&#8592; prev</button>' +
        '<button id="btn-chord-hear" class="btn" style="padding:8px 18px;font-size:14px;">&#9658; hear it</button>' +
        '<button id="btn-chord-next" class="ghost" style="border-radius:3px;padding:8px 16px;font-size:13px;cursor:pointer;">next &#8594;</button>' +
      "</div>"
    );
  }

  var progressionPlaybackToken = 0;
  function playProgressionStep(lesson, prog, stepIdx, token) {
    if (token !== progressionPlaybackToken) return; // a newer playback (or navigation) superseded this one
    if (stepIdx >= prog.chordNames.length) { state.pianoProgressionPlaying = false; render(); return; }
    state.pianoProgressionStep = stepIdx;
    state.pianoProgressionPlaying = true;
    render();
    var shape = CHORD_SHAPES[prog.chordNames[stepIdx]];
    scrollPianoToNote(shape[0]);
    shape.forEach(function (n) { playNote(n.n, n.o, 0.8); });
    setTimeout(function () { playProgressionStep(lesson, prog, stepIdx + 1, token); }, 1000);
  }
  function playCurrentProgression() {
    progressionPlaybackToken++;
    var lesson = PIANO_LESSONS[state.pianoLessonIdx];
    var prog = lesson.progressions[state.pianoProgressionIdx];
    playProgressionStep(lesson, prog, 0, progressionPlaybackToken);
  }
  function goToProgression(lesson, i) {
    var n = lesson.progressions.length;
    state.pianoProgressionIdx = ((i % n) + n) % n;
    state.pianoProgressionStep = 0;
    state.pianoProgressionPlaying = false;
    render();
    playCurrentProgression();
  }
  function nextProgression() { goToProgression(PIANO_LESSONS[state.pianoLessonIdx], state.pianoProgressionIdx + 1); }
  function prevProgression() { goToProgression(PIANO_LESSONS[state.pianoLessonIdx], state.pianoProgressionIdx - 1); }
  function progressionControlsHtml(lesson) {
    var prog = lesson.progressions[state.pianoProgressionIdx];
    var chordTrail = prog.chordNames.map(function (name, i) {
      var active = i === state.pianoProgressionStep && state.pianoProgressionPlaying;
      return '<span style="color:' + (active ? "var(--brass)" : "var(--muted)") + ";font-weight:" + (active ? "700" : "400") + ';">' + esc(name) + "</span>";
    }).join(' <span style="color:var(--muted);">&#8594;</span> ');
    return (
      '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--muted);margin-bottom:8px;">' + (state.pianoProgressionIdx + 1) + " / " + lesson.progressions.length + "</div>" +
      '<div style="font-family:\'Big Shoulders Display\',sans-serif;font-weight:700;font-size:22px;letter-spacing:0.02em;margin-bottom:10px;">' + esc(prog.name) + "</div>" +
      '<div style="font-size:14px;line-height:1.6;margin-bottom:16px;">' + chordTrail + "</div>" +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
        '<button id="btn-prog-prev" class="ghost" style="border-radius:3px;padding:8px 16px;font-size:13px;cursor:pointer;">&#8592; prev</button>' +
        '<button id="btn-prog-hear" class="btn" style="padding:8px 18px;font-size:14px;">' + (state.pianoProgressionPlaying ? "&#9658; playing…" : "&#9658; hear it") + "</button>" +
        '<button id="btn-prog-next" class="ghost" style="border-radius:3px;padding:8px 16px;font-size:13px;cursor:pointer;">next &#8594;</button>' +
      "</div>"
    );
  }

  function pianoViewHtml() {
    var lesson = PIANO_LESSONS[state.pianoLessonIdx];
    var out = (
      '<div style="display:flex;gap:6px;margin-bottom:14px;">' +
      PIANO_LESSONS.map(function (l, i) {
        var active = i === state.pianoLessonIdx;
        return '<button data-piano-lesson="' + i + '" class="ghost piano-lesson-btn" style="flex:1;border-radius:4px;padding:8px 4px;font-size:11px;cursor:pointer;text-transform:uppercase;letter-spacing:0.06em;' +
          "background:" + (active ? "var(--panelUp)" : "var(--panel)") + ";color:" + (active ? "var(--cream)" : "var(--muted)") + ";border-color:" + (active ? "var(--brassDim)" : "var(--line)") + ';">' +
          esc(l.name) + "</button>";
      }).join("") +
      "</div>"
    );
    var completions = loadPianoCompletions();
    var completedCount = completions[lesson.id] || 0;
    out += (
      '<div class="card" style="margin-bottom:14px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;">' +
          '<div class="eyebrow">piano · basic ear training</div>' +
          ((lesson.mode === "sequence" || lesson.mode === "listen") && completedCount > 0
            ? '<span class="eyebrow" style="color:var(--ok);">completed ' + completedCount + "x</span>"
            : "") +
        "</div>" +
        '<h2 style="font-family:\'Big Shoulders Display\',sans-serif;font-weight:700;font-size:22px;margin:6px 0 10px;">' + esc(lesson.name) + "</h2>" +
        '<p style="font-size:14px;line-height:1.5;color:var(--cream);margin:0 0 14px;">' + esc(lesson.instructions) + "</p>" +
        (lesson.mode === "sequence" ? sequenceLessonControlsHtml(lesson) : lesson.mode === "listen" ? listenLessonControlsHtml(lesson) : lesson.mode === "chords" ? chordControlsHtml(lesson) : lesson.mode === "progressions" ? progressionControlsHtml(lesson) : matchLessonControlsHtml()) +
        (state.pianoMsg ? '<p style="margin-top:12px;font-size:13px;color:var(--brass);">' + esc(state.pianoMsg) + "</p>" : "") +
      "</div>"
    );
    out += '<div class="card">' + keyboardHtml(lesson) + "</div>";
    return out;
  }

  /* ---------- perception demos ---------- */
  function selectPerceptionLesson(i) {
    state.perceptionLessonIdx = i;
    state.perception = freshPerceptionState();
    render();
  }

  function hexToRgb(hex) {
    var m = hex.replace("#", "");
    return { r: parseInt(m.substr(0, 2), 16), g: parseInt(m.substr(2, 2), 16), b: parseInt(m.substr(4, 2), 16) };
  }
  function rgbToHex(r, g, b) {
    function c(v) { return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0"); }
    return "#" + c(r) + c(g) + c(b);
  }
  function simulateDeuteranopia(hex) {
    var rgb = hexToRgb(hex);
    var r2 = 0.625 * rgb.r + 0.375 * rgb.g;
    var g2 = 0.7 * rgb.r + 0.3 * rgb.g;
    var b2 = 0.3 * rgb.g + 0.7 * rgb.b;
    return rgbToHex(r2, g2, b2);
  }

  /* pop-out */
  var POP_ROUNDS = [16, 36, 64];
  function startPopRound() {
    var pop = state.perception.pop;
    pop.phase = "waiting";
    render();
    var delay = 500 + Math.random() * 1000;
    setTimeout(function () {
      pop.gridSize = POP_ROUNDS[pop.round];
      pop.targetIndex = Math.floor(Math.random() * pop.gridSize);
      pop.phase = "active";
      pop.startTime = performance.now();
      render();
    }, delay);
  }
  function tapPopCell(i) {
    var pop = state.perception.pop;
    if (pop.phase !== "active" || i !== pop.targetIndex) return;
    var elapsed = Math.round(performance.now() - pop.startTime);
    pop.results.push({ gridSize: pop.gridSize, ms: elapsed });
    pop.round++;
    pop.phase = pop.round >= POP_ROUNDS.length ? "done" : "idle";
    render();
  }
  function popDemoHtml() {
    var pop = state.perception.pop;
    var out = "";
    pop.results.forEach(function (r) {
      out += '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--muted);margin-bottom:4px;">grid of ' + r.gridSize + ": " + r.ms + " ms</div>";
    });
    if (pop.phase === "idle" || pop.phase === "waiting") {
      out += '<button id="btn-pop-start" class="btn"' + (pop.phase === "waiting" ? " disabled" : "") + ">" + (pop.phase === "waiting" ? "Get ready…" : (pop.round === 0 ? "Start" : "Next round") + " (" + (pop.round + 1) + "/" + POP_ROUNDS.length + ")") + "</button>";
    } else if (pop.phase === "active") {
      var cols = Math.round(Math.sqrt(pop.gridSize));
      var cells = "";
      for (var i = 0; i < pop.gridSize; i++) {
        var isTarget = i === pop.targetIndex;
        cells += '<div class="pop-cell" data-pop-i="' + i + '" style="background:' + (isTarget ? "var(--brass)" : "var(--line)") + ';"></div>';
      }
      out += '<div style="display:grid;grid-template-columns:repeat(' + cols + ',1fr);gap:6px;">' + cells + "</div>";
    } else if (pop.phase === "done") {
      var avg = Math.round(pop.results.reduce(function (a, r) { return a + r.ms; }, 0) / pop.results.length);
      out += '<p style="font-size:13px;color:var(--brass);margin-top:4px;">Average: ' + avg + " ms across grid sizes 16→64. Notice it barely scales with distractor count — that flatness is the signature of preattentive processing.</p>";
      out += '<button id="btn-pop-restart" class="ghost" style="border-radius:3px;padding:6px 14px;font-size:12px;cursor:pointer;margin-top:8px;">try again</button>';
    }
    return out;
  }

  /* bar vs pie accuracy */
  function ensureAccuracyPair(acc, phase) {
    var aKey = phase + "A", bKey = phase + "B";
    if (!acc[aKey]) {
      acc[aKey] = 20 + Math.floor(Math.random() * 60);
      acc[bKey] = 20 + Math.floor(Math.random() * 60);
    }
  }
  function submitAccuracyEstimate() {
    var acc = state.perception.accuracy;
    var input = document.getElementById("accuracy-estimate-input");
    var val = parseFloat(input.value);
    if (isNaN(val)) return;
    if (acc.phase === "bar") {
      acc.barEstimate = val;
      acc.barErrorPct = Math.abs(val - Math.round((100 * acc.barA) / acc.barB));
      acc.phase = "pie";
    } else if (acc.phase === "pie") {
      acc.pieEstimate = val;
      acc.pieErrorPct = Math.abs(val - Math.round((100 * acc.pieA) / acc.pieB));
      acc.phase = "done";
    }
    render();
  }
  function accuracyDemoHtml() {
    var acc = state.perception.accuracy;
    if (acc.phase === "bar" || acc.phase === "pie") {
      ensureAccuracyPair(acc, acc.phase);
      var a = acc[acc.phase + "A"], b = acc[acc.phase + "B"];
      var chartHtml;
      if (acc.phase === "bar") {
        var maxH = 140, scale = maxH / Math.max(a, b);
        chartHtml = '<div style="display:flex;gap:24px;align-items:flex-end;height:' + maxH + 'px;justify-content:center;">' +
          '<div style="width:48px;background:var(--brass);height:' + (a * scale) + 'px;"></div>' +
          '<div style="width:48px;background:var(--ok);height:' + (b * scale) + 'px;"></div>' +
        "</div>" +
        '<div style="display:flex;gap:24px;justify-content:center;margin-top:6px;"><span style="width:48px;text-align:center;font-size:11px;color:var(--muted);">A</span><span style="width:48px;text-align:center;font-size:11px;color:var(--muted);">B</span></div>';
      } else {
        var total = a + b;
        var angle = (a / total) * 360;
        chartHtml = '<svg viewBox="0 0 120 120" style="width:160px;height:160px;display:block;margin:0 auto;">' +
          '<circle cx="60" cy="60" r="55" fill="var(--ok)"></circle>' +
          '<path d="M60,60 L60,5 A55,55 0 ' + (angle > 180 ? 1 : 0) + ',1 ' + (60 + 55 * Math.sin(angle * Math.PI / 180)) + "," + (60 - 55 * Math.cos(angle * Math.PI / 180)) + ' Z" fill="var(--brass)"></path>' +
        "</svg>" +
        '<div style="text-align:center;font-size:11px;color:var(--muted);margin-top:4px;">brass slice = A, green slice = B</div>';
      }
      return (
        '<div class="eyebrow" style="margin-bottom:8px;">' + (acc.phase === "bar" ? "round 1 · bar chart" : "round 2 · pie chart") + "</div>" +
        chartHtml +
        '<div style="margin-top:16px;display:flex;gap:8px;align-items:center;justify-content:center;">' +
          '<span style="font-size:13px;color:var(--muted);">A is about</span>' +
          '<input id="accuracy-estimate-input" type="number" style="width:70px;text-align:center;" placeholder="%">' +
          '<span style="font-size:13px;color:var(--muted);">% of B</span>' +
          '<button id="btn-accuracy-submit" class="btn" style="padding:8px 16px;font-size:13px;">Submit</button>' +
        "</div>"
      );
    }
    return (
      '<div class="eyebrow" style="margin-bottom:8px;">results</div>' +
      '<p style="font-size:14px;">Bar estimate was off by <b style="color:var(--brass);">' + acc.barErrorPct + " points</b>. Pie estimate was off by <b style=\"color:var(--brass);\">" + acc.pieErrorPct + " points</b>.</p>" +
      '<button id="btn-accuracy-restart" class="ghost" style="border-radius:3px;padding:6px 14px;font-size:12px;cursor:pointer;">try again</button>'
    );
  }

  /* truncated axis */
  function ensureAxisValues(axis) {
    if (!axis.valueA) {
      var base = 40 + Math.floor(Math.random() * 20);
      var diffPct = 3 + Math.random() * 8;
      axis.valueA = base;
      axis.valueB = Math.round(base * (1 + diffPct / 100));
    }
  }
  function submitAxisEstimate() {
    var axis = state.perception.axis;
    var input = document.getElementById("axis-estimate-input");
    var val = parseFloat(input.value);
    if (isNaN(val)) return;
    axis.estimate = val;
    axis.phase = "revealed";
    render();
  }
  function axisBarsHtml(axis, truncated) {
    var lo = truncated ? Math.min(axis.valueA, axis.valueB) - 3 : 0;
    var hi = Math.max(axis.valueA, axis.valueB) + 3;
    var range = hi - lo;
    var maxH = 140;
    function h(v) { return Math.max(2, ((v - lo) / range) * maxH); }
    return (
      '<div style="display:flex;gap:24px;align-items:flex-end;height:' + maxH + 'px;justify-content:center;">' +
        '<div style="width:48px;background:var(--brass);height:' + h(axis.valueA) + 'px;"></div>' +
        '<div style="width:48px;background:var(--ok);height:' + h(axis.valueB) + 'px;"></div>' +
      "</div>" +
      '<div style="text-align:center;font-size:11px;color:var(--muted);margin-top:6px;">axis starts at ' + Math.round(lo) + (truncated ? " (not 0)" : " (zero baseline)") + "</div>"
    );
  }
  function axisDemoHtml() {
    var axis = state.perception.axis;
    ensureAxisValues(axis);
    if (axis.phase === "truncated") {
      return (
        '<div class="eyebrow" style="margin-bottom:8px;">this quarter vs. last</div>' +
        axisBarsHtml(axis, true) +
        '<div style="margin-top:16px;display:flex;gap:8px;align-items:center;justify-content:center;">' +
          '<span style="font-size:13px;color:var(--muted);">B looks bigger by about</span>' +
          '<input id="axis-estimate-input" type="number" style="width:70px;text-align:center;" placeholder="%">' +
          '<span style="font-size:13px;color:var(--muted);">%</span>' +
          '<button id="btn-axis-submit" class="btn" style="padding:8px 16px;font-size:13px;">Submit</button>' +
        "</div>"
      );
    }
    var trueDiff = Math.round((100 * (axis.valueB - axis.valueA)) / axis.valueA);
    return (
      '<div class="eyebrow" style="margin-bottom:8px;">same data, zero baseline</div>' +
      axisBarsHtml(axis, false) +
      '<p style="font-size:14px;margin-top:14px;">You estimated <b style="color:var(--brass);">' + axis.estimate + "%</b>. The real difference is <b style=\"color:var(--brass);\">" + trueDiff + "%</b>.</p>" +
      '<button id="btn-axis-restart" class="ghost" style="border-radius:3px;padding:6px 14px;font-size:12px;cursor:pointer;">try again</button>'
    );
  }

  /* color-vision deficiency */
  function ensureCvdChips(cvd) {
    if (!cvd.chips.length) {
      var statuses = ["good", "good", "good", "good", "bad", "bad"];
      for (var i = statuses.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = statuses[i]; statuses[i] = statuses[j]; statuses[j] = tmp;
      }
      cvd.chips = statuses;
    }
  }
  function revealCvd() {
    state.perception.cvd.revealed = true;
    render();
  }
  function chipsRowHtml(chips, simulate) {
    return '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">' +
      chips.map(function (status) {
        var base = status === "good" ? "#7FA86B" : "#E0523C";
        var color = simulate ? simulateDeuteranopia(base) : base;
        return '<div style="width:36px;height:36px;border-radius:6px;background:' + color + ';"></div>';
      }).join("") +
    "</div>";
  }
  function cvdDemoHtml() {
    var cvd = state.perception.cvd;
    ensureCvdChips(cvd);
    var out = '<div class="eyebrow" style="margin-bottom:8px;">how many are flagged “bad”?</div>' + chipsRowHtml(cvd.chips, false);
    if (!cvd.revealed) {
      out += '<div style="margin-top:16px;text-align:center;"><button id="btn-cvd-reveal" class="btn" style="padding:8px 18px;font-size:13px;">Reveal + simulate deuteranopia</button></div>';
    } else {
      var badCount = cvd.chips.filter(function (s) { return s === "bad"; }).length;
      out += '<p style="font-size:13px;margin-top:14px;color:var(--muted);">Actual count: <b style="color:var(--brass);">' + badCount + " bad</b> (of " + cvd.chips.length + ").</p>" +
        '<div class="eyebrow" style="margin:14px 0 8px;">approximate deuteranopia simulation</div>' +
        chipsRowHtml(cvd.chips, true) +
        '<p style="font-size:12px;color:var(--muted);margin-top:10px;">Approximation only — severity varies by individual. Notice how much closer the two colors sit once simulated.</p>' +
        '<button id="btn-cvd-restart" class="ghost" style="border-radius:3px;padding:6px 14px;font-size:12px;cursor:pointer;margin-top:8px;">new set</button>';
    }
    return out;
  }

  /* change blindness */
  var BLINDNESS_LABELS = ["Revenue", "Orders", "Avg Price", "Returns"];
  function startBlindnessDemo() {
    var bl = state.perception.blindness;
    var values = BLINDNESS_LABELS.map(function () { return 40 + Math.floor(Math.random() * 60); });
    var changedIndex = Math.floor(Math.random() * BLINDNESS_LABELS.length);
    bl.values = values;
    bl.changedIndex = changedIndex;
    bl.answered = false;
    bl.guessIndex = null;
    bl.phase = "showingA";
    render();
    setTimeout(function () {
      bl.phase = "blank";
      render();
      setTimeout(function () {
        bl.phase = "showingB";
        render();
      }, 200);
    }, 1800);
  }
  function answerBlindness(guessIndex) {
    var bl = state.perception.blindness;
    if (bl.phase !== "showingB") return;
    bl.guessIndex = guessIndex;
    bl.answered = true;
    bl.phase = "answered";
    render();
  }
  function blindnessTilesHtml(values, highlightIndex) {
    return '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;">' +
      BLINDNESS_LABELS.map(function (label, i) {
        return '<div class="card" style="padding:10px;text-align:center;' + (highlightIndex === i ? "border-color:var(--brass);" : "") + '">' +
          '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;">' + esc(label) + "</div>" +
          '<div style="font-family:\'IBM Plex Mono\',monospace;font-size:20px;margin-top:4px;">' + values[i] + "</div>" +
        "</div>";
      }).join("") +
    "</div>";
  }
  function blindnessDemoHtml() {
    var bl = state.perception.blindness;
    if (bl.phase === "idle") {
      return '<button id="btn-blindness-start" class="btn">Start</button>';
    }
    if (bl.phase === "showingA") {
      return '<p style="font-size:13px;color:var(--muted);margin-bottom:10px;">Look at these — something will change in a moment.</p>' + blindnessTilesHtml(bl.values, null);
    }
    if (bl.phase === "blank") {
      return '<div style="height:140px;background:var(--ink);border-radius:6px;"></div>';
    }
    if (bl.phase === "showingB") {
      var displayValues = bl.values.slice();
      displayValues[bl.changedIndex] = Math.round(displayValues[bl.changedIndex] * 0.6);
      return blindnessTilesHtml(displayValues, null) +
        '<p style="font-size:13px;margin:14px 0 8px;">Did anything change? Tap the tile, or say nothing changed.</p>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
          BLINDNESS_LABELS.map(function (label, i) {
            return '<button data-blindness-guess="' + i + '" class="ghost blindness-guess-btn" style="border-radius:3px;padding:6px 12px;font-size:12px;cursor:pointer;">' + esc(label) + "</button>";
          }).join("") +
          '<button data-blindness-guess="-1" class="ghost blindness-guess-btn" style="border-radius:3px;padding:6px 12px;font-size:12px;cursor:pointer;">nothing changed</button>' +
        "</div>";
    }
    // answered
    var finalValues = bl.values.slice();
    var changedFrom = finalValues[bl.changedIndex];
    finalValues[bl.changedIndex] = Math.round(finalValues[bl.changedIndex] * 0.6);
    var correct = bl.guessIndex === bl.changedIndex;
    return blindnessTilesHtml(finalValues, bl.changedIndex) +
      '<p style="font-size:13px;margin-top:14px;">' + (correct ? "You caught it. " : "Missed it — ") + esc(BLINDNESS_LABELS[bl.changedIndex]) + " went from " + changedFrom + " to " + finalValues[bl.changedIndex] + " (" + Math.round(100 * (finalValues[bl.changedIndex] - changedFrom) / changedFrom) + "%).</p>" +
      '<button id="btn-blindness-restart" class="ghost" style="border-radius:3px;padding:6px 14px;font-size:12px;cursor:pointer;">try again</button>';
  }

  function perceptionDemoHtml(lesson) {
    if (lesson.demo === "pop") return popDemoHtml();
    if (lesson.demo === "accuracy") return accuracyDemoHtml();
    if (lesson.demo === "axis") return axisDemoHtml();
    if (lesson.demo === "cvd") return cvdDemoHtml();
    if (lesson.demo === "blindness") return blindnessDemoHtml();
    return "";
  }

  function perceptionViewHtml() {
    var lesson = PERCEPTION_LESSONS[state.perceptionLessonIdx];
    var out = (
      '<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;">' +
      PERCEPTION_LESSONS.map(function (l, i) {
        var active = i === state.perceptionLessonIdx;
        return '<button data-perception-lesson="' + i + '" class="ghost perception-lesson-btn" style="flex:1 1 30%;border-radius:4px;padding:8px 4px;font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em;' +
          "background:" + (active ? "var(--panelUp)" : "var(--panel)") + ";color:" + (active ? "var(--cream)" : "var(--muted)") + ";border-color:" + (active ? "var(--brassDim)" : "var(--line)") + ';">' +
          esc(l.name) + "</button>";
      }).join("") +
      "</div>"
    );
    out += (
      '<div class="card" style="margin-bottom:14px;">' +
        '<div class="eyebrow">perceptual science · applied to BI</div>' +
        '<h2 style="font-family:\'Big Shoulders Display\',sans-serif;font-weight:700;font-size:22px;margin:6px 0 10px;">' + esc(lesson.name) + "</h2>" +
        '<p style="font-size:14px;line-height:1.55;color:var(--cream);margin:0 0 10px;">' + esc(lesson.concept) + "</p>" +
        '<p style="font-size:13px;line-height:1.5;color:var(--brass);margin:0;padding:10px;background:var(--panelUp);border-radius:4px;">' + esc(lesson.biNote) + "</p>" +
      "</div>"
    );
    out += '<div class="card">' + perceptionDemoHtml(lesson) + "</div>";
    return out;
  }

  /* ---------- media traps quiz ---------- */
  function selectTrapAnswer(key) {
    if (state.trapAnswered) return;
    state.trapSelected = key;
    state.trapAnswered = true;
    if (key === MEDIA_SCENARIOS[state.trapIdx].correctType) state.trapCorrectCount++;
    render();
  }
  function nextTrapScenario() {
    state.trapIdx++;
    state.trapSelected = null;
    state.trapAnswered = false;
    if (state.trapIdx >= MEDIA_SCENARIOS.length) recordTrapCompletion(state.trapCorrectCount);
    render();
  }
  function restartTrapQuiz() {
    state.trapIdx = 0;
    state.trapSelected = null;
    state.trapAnswered = false;
    state.trapCorrectCount = 0;
    render();
  }
  function trapsViewHtml() {
    if (state.trapIdx >= MEDIA_SCENARIOS.length) {
      var hist = loadTrapHistory();
      return (
        '<div class="card">' +
          '<div class="eyebrow">media training · trap recognition</div>' +
          '<h2 style="font-family:\'Big Shoulders Display\',sans-serif;font-weight:700;font-size:22px;margin:6px 0 14px;">Round complete</h2>' +
          '<p style="font-size:15px;">You got <b style="color:var(--brass);">' + state.trapCorrectCount + " / " + MEDIA_SCENARIOS.length + "</b> right.</p>" +
          '<p style="font-size:12px;color:var(--muted);margin-top:8px;">Best: ' + hist.bestScore + " / " + MEDIA_SCENARIOS.length + " across " + hist.runs + " run" + (hist.runs === 1 ? "" : "s") + "</p>" +
          '<button id="btn-trap-restart" class="btn" style="margin-top:12px;">Try again</button>' +
        "</div>"
      );
    }
    var scenario = MEDIA_SCENARIOS[state.trapIdx];
    var out = (
      '<div class="card" style="margin-bottom:14px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">' +
          '<div class="eyebrow">media training · trap recognition</div>' +
          '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--muted);">' + (state.trapIdx + 1) + " / " + MEDIA_SCENARIOS.length + "</span>" +
        "</div>" +
        '<p style="font-size:15px;line-height:1.55;color:var(--cream);margin:0;">' + scenario.prompt + "</p>" +
      "</div>"
    );
    out += '<div class="card" style="margin-bottom:14px;">' +
      '<div class="eyebrow" style="margin-bottom:8px;">what is this?</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
      TRAP_TYPES.map(function (t) {
        var isSelected = state.trapSelected === t;
        var isCorrectType = t === scenario.correctType;
        var bg = "var(--panel)", border = "var(--line)", color = "var(--muted)";
        if (state.trapAnswered && isCorrectType) { bg = "var(--panelUp)"; border = "var(--ok)"; color = "var(--ok)"; }
        else if (state.trapAnswered && isSelected) { bg = "var(--panelUp)"; border = "var(--rec)"; color = "var(--rec)"; }
        return '<button data-trap-answer="' + esc(t) + '" class="ghost trap-answer-btn" style="border-radius:20px;padding:6px 14px;font-size:12px;cursor:' + (state.trapAnswered ? "default" : "pointer") + ";" +
          "background:" + bg + ";border-color:" + border + ";color:" + color + ';"' + (state.trapAnswered ? " disabled" : "") + ">" + esc(t) + "</button>";
      }).join("") +
      "</div>" +
    "</div>";
    if (state.trapAnswered) {
      var correct = state.trapSelected === scenario.correctType;
      out += '<div class="card">' +
        '<p style="font-size:13px;color:' + (correct ? "var(--ok)" : "var(--rec)") + ';margin:0 0 8px;">' + (correct ? "Correct." : "Not quite — this was " + esc(scenario.correctType) + ".") + "</p>" +
        '<p style="font-size:14px;line-height:1.5;color:var(--cream);margin:0;">' + esc(scenario.rightMove) + "</p>" +
        '<button id="btn-trap-next" class="btn" style="margin-top:14px;">' + (state.trapIdx + 1 >= MEDIA_SCENARIOS.length ? "See results" : "Next") + "</button>" +
      "</div>";
    }
    return out;
  }

  function render() {
    var app = document.getElementById("app");
    var prevKbScroll = document.getElementById("piano-keyboard-scroll");
    var savedScrollLeft = prevKbScroll ? prevKbScroll.scrollLeft : null;
    app.innerHTML =
      '<div class="wrap">' +
        headerHtml() +
        countersHtml() +
        settingsHtml() +
        tabsHtml() +
        (state.view === "today" ? todayViewHtml() : state.view === "piano" ? pianoViewHtml() : state.view === "perception" ? perceptionViewHtml() : state.view === "traps" ? trapsViewHtml() : logViewHtml()) +
      "</div>";
    attachHandlers();
    // a full re-render recreates the keyboard's scroll container from scratch (scrollLeft resets to 0) --
    // every key tap calls render(), so without this the keyboard would snap back to the start on every tap.
    if (savedScrollLeft !== null) {
      var newKbScroll = document.getElementById("piano-keyboard-scroll");
      if (newKbScroll) newKbScroll.scrollLeft = savedScrollLeft;
    }
  }

  /* ---------- targeted updates (avoid full re-render while typing / ticking) ---------- */
  function updateTimerUI() {
    var el = document.getElementById("timer-display");
    if (el) {
      el.textContent = mm() + ":" + ss();
      el.style.color = state.remaining === 0 ? "var(--rec)" : "var(--cream)";
    }
  }
  function updateTranscriptUI() {
    var area = document.getElementById("transcript-area");
    if (area && area.value !== state.transcript) area.value = state.transcript;
    var line = document.getElementById("metrics-line");
    if (line) {
      var m = currentMetrics();
      line.style.display = state.transcript ? "flex" : "none";
      line.innerHTML = '<span>' + m.words + ' words</span><span>' + m.wpm + ' wpm</span><span style="color:' + (m.fillerCount > 2 ? "var(--rec)" : "var(--ok)") + '">' + m.fillerCount + " fillers</span>";
    }
    var scoreBtn = document.getElementById("btn-score");
    if (scoreBtn) scoreBtn.disabled = state.scoring || !state.transcript.trim();
  }

  function attachHandlers() {
    var el;
    if ((el = document.getElementById("btn-settings"))) el.onclick = function () {
      state.settingsOpen = !state.settingsOpen;
      render();
      if (state.settingsOpen) refreshStorageEstimate();
    };
    if ((el = document.getElementById("btn-save-key"))) el.onclick = function () { saveKey(document.getElementById("api-key-input").value.trim()); };
    if ((el = document.getElementById("btn-clear-key"))) el.onclick = clearKey;
    if ((el = document.getElementById("btn-close-settings"))) el.onclick = function () { state.settingsOpen = false; render(); };

    document.querySelectorAll(".view-tab").forEach(function (b) {
      b.onclick = function () { switchView(b.getAttribute("data-view")); };
    });
    document.querySelectorAll(".step-btn").forEach(function (b) {
      b.onclick = function () { selectStep(parseInt(b.getAttribute("data-step"), 10)); };
    });
    document.querySelectorAll(".track-chip").forEach(function (b) {
      b.onclick = function () { setFocusTrack(b.getAttribute("data-track") || null); };
    });

    if ((el = document.getElementById("btn-start"))) el.onclick = startStep;
    if ((el = document.getElementById("btn-done-early"))) el.onclick = finishStep;
    if ((el = document.getElementById("btn-mark-complete"))) el.onclick = finishStep;
    if ((el = document.getElementById("btn-reset"))) el.onclick = resetStep;
    if ((el = document.getElementById("btn-reroll"))) el.onclick = rerollStep;
    if ((el = document.getElementById("btn-hear-example"))) el.onclick = function () {
      if (state.speakingExample) { stopSpeaking(); render(); }
      else { speakExample(currentStep().example); render(); }
    };
    if ((el = document.getElementById("btn-toggle-example"))) el.onclick = function () { state.showExample = !state.showExample; render(); };
    if ((el = document.getElementById("btn-toggle-video"))) el.onclick = function () { state.showVideo = !state.showVideo; render(); };
    if ((el = document.getElementById("btn-mic"))) el.onclick = function () { state.listening ? stopListening() : startListening(); };
    if ((el = document.getElementById("btn-score"))) el.onclick = runScore;
    if ((el = document.getElementById("btn-save-session"))) el.onclick = saveSession;
    document.querySelectorAll(".play-clip-btn").forEach(function (b) {
      b.onclick = function () { playClip(b.getAttribute("data-audio-key"), b); };
    });
    document.querySelectorAll(".compare-btn").forEach(function (b) {
      b.onclick = function () { compareWithDay1(b.getAttribute("data-current"), b.getAttribute("data-day1"), b); };
    });
    document.querySelectorAll(".delete-session-btn").forEach(function (b) {
      b.onclick = function () { deleteSession(b.getAttribute("data-date")); };
    });
    document.querySelectorAll(".piano-lesson-btn").forEach(function (b) {
      b.onclick = function () { selectPianoLesson(parseInt(b.getAttribute("data-piano-lesson"), 10)); };
    });
    document.querySelectorAll(".piano-key").forEach(function (k) {
      k.onclick = function () {
        var m = k.getAttribute("data-note").match(/^([A-G]#?)(\d)$/);
        onPianoKeyTap({ n: m[1], o: parseInt(m[2], 10) });
      };
    });
    if ((el = document.getElementById("btn-piano-restart"))) el.onclick = restartPianoLesson;
    if ((el = document.getElementById("btn-piano-prompt"))) el.onclick = pianoPlayPrompt;
    if ((el = document.getElementById("btn-listen-start"))) el.onclick = startPitchListening;
    if ((el = document.getElementById("btn-listen-stop"))) el.onclick = stopPitchListening;
    if ((el = document.getElementById("btn-chord-prev"))) el.onclick = prevChord;
    if ((el = document.getElementById("btn-chord-next"))) el.onclick = nextChord;
    if ((el = document.getElementById("btn-chord-hear"))) el.onclick = hearChord;
    if ((el = document.getElementById("btn-prog-prev"))) el.onclick = prevProgression;
    if ((el = document.getElementById("btn-prog-next"))) el.onclick = nextProgression;
    if ((el = document.getElementById("btn-prog-hear"))) el.onclick = playCurrentProgression;

    document.querySelectorAll(".perception-lesson-btn").forEach(function (b) {
      b.onclick = function () { selectPerceptionLesson(parseInt(b.getAttribute("data-perception-lesson"), 10)); };
    });
    if ((el = document.getElementById("btn-pop-start"))) el.onclick = startPopRound;
    if ((el = document.getElementById("btn-pop-restart"))) el.onclick = function () { state.perception.pop = freshPerceptionState().pop; render(); };
    document.querySelectorAll(".pop-cell").forEach(function (c) {
      c.onclick = function () { tapPopCell(parseInt(c.getAttribute("data-pop-i"), 10)); };
    });
    if ((el = document.getElementById("btn-accuracy-submit"))) el.onclick = submitAccuracyEstimate;
    if ((el = document.getElementById("btn-accuracy-restart"))) el.onclick = function () { state.perception.accuracy = freshPerceptionState().accuracy; render(); };
    if ((el = document.getElementById("btn-axis-submit"))) el.onclick = submitAxisEstimate;
    if ((el = document.getElementById("btn-axis-restart"))) el.onclick = function () { state.perception.axis = freshPerceptionState().axis; render(); };
    if ((el = document.getElementById("btn-cvd-reveal"))) el.onclick = revealCvd;
    if ((el = document.getElementById("btn-cvd-restart"))) el.onclick = function () { state.perception.cvd = freshPerceptionState().cvd; render(); };
    if ((el = document.getElementById("btn-blindness-start"))) el.onclick = startBlindnessDemo;
    if ((el = document.getElementById("btn-blindness-restart"))) el.onclick = function () { state.perception.blindness = freshPerceptionState().blindness; render(); };

    document.querySelectorAll(".trap-answer-btn").forEach(function (b) {
      b.onclick = function () { selectTrapAnswer(b.getAttribute("data-trap-answer")); };
    });
    if ((el = document.getElementById("btn-trap-next"))) el.onclick = nextTrapScenario;
    if ((el = document.getElementById("btn-trap-restart"))) el.onclick = restartTrapQuiz;
    document.querySelectorAll(".blindness-guess-btn").forEach(function (b) {
      b.onclick = function () { answerBlindness(parseInt(b.getAttribute("data-blindness-guess"), 10)); };
    });
    if ((el = document.getElementById("btn-export"))) el.onclick = exportBackup;
    if ((el = document.getElementById("btn-import"))) {
      el.onclick = function () { document.getElementById("import-file-input").click(); };
    }
    var importInput = document.getElementById("import-file-input");
    if (importInput) {
      importInput.onchange = function () { importBackup(importInput.files[0]); };
    }

    if ((el = document.getElementById("transcript-area"))) {
      el.oninput = function () {
        state.transcript = el.value;
        updateTranscriptUI();
      };
    }
  }

  render();

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
